server:
  port: 19090

spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  cloud:
    gateway:
      routes:
        - id: oj-friend
          uri: lb://oj-friend
          predicates:
            - Path=/friend/**
          filters:
            - StripPrefix=1
        - id: oj-system
          uri: lb://oj-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1

jwt:
  secret: "b25saW5lLWp1ZGdlLWxvY2FsLWRldi1zZWNyZXQta2V5LTAxMjM0NTY3ODlhYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5ei1BQkNERUY="

security:
  ignore:
    whites:
      - /friend/user/login
      - /friend/user/sendCode
      - /system/sysUser/login

logging:
  level:
    com.oj: info
