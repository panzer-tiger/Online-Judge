version: '3.8'

networks:
  online-judge:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: oj-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../deploy:/docker-entrypoint-initdb.d
    networks:
      - online-judge
    restart: unless-stopped

  redis:
    image: redis
    container_name: oj-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - online-judge
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: oj-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: online_judge
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: 123456
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai"
      TZ: Asia/Shanghai
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - online-judge
    depends_on:
      - mysql
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.7.1
    container_name: oj-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - online-judge
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: oj-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - online-judge
    restart: unless-stopped

  nginx:
    image: nginx
    container_name: oj-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
    networks:
      - online-judge
    depends_on:
      - mysql
      - redis
      - nacos
      - elasticsearch
      - rabbitmq
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  es-data:
  rabbitmq-data:
